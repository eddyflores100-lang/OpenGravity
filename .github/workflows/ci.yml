name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  oracle:
    name: Oracle backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: pytest tests/ -q

      - name: Verify app imports
        run: python -c "from main import app; print('Oracle app OK:', app.title)"

  core:
    name: Core bot (Node/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
